<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Pact Machine</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
padding:40px;
}

.card{
background:white;
width:700px;
padding:30px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h1,h2,h3{
text-align:center;
}

button{
padding:14px 24px;
font-size:16px;
cursor:pointer;
margin:8px;
}

.big-btn{
width:200px;
}

.center{
text-align:center;
}

.scoreboard{
display:flex;
justify-content:space-around;
margin:20px 0;
padding:15px;
background:#fafafa;
border-radius:8px;
}

.status{
padding:15px;
background:#f0f0f0;
border-radius:8px;
margin-top:10px;
}

.hidden{
display:none;
}

.progress{
margin:20px 0;
font-weight:bold;
text-align:center;
}

input{
padding:10px;
font-size:16px;
width:250px;
}

</style>

</head>

<body>

<div class="card">

<h1>Pact Machine</h1>

<div id="lobby">

<div class="center">

<button id="createRoom">
Create Room
</button>

<p id="share"></p>

</div>

</div>

<div id="joinSection" class="hidden">

<h2>Enter Your Name</h2>

<div class="center">

<input id="nameInput" placeholder="Your name">

<br><br>

<button id="joinBtn">
Join Game
</button>

</div>

</div>

<div id="game" class="hidden">

<h2 id="players"></h2>

<div class="progress" id="roundCounter"></div>

<div class="scoreboard" id="scoreboard"></div>

<div class="center">

<button
class="big-btn"
id="coopBtn">
Cooperate
</button>

<button
class="big-btn"
id="compBtn">
Compete
</button>

</div>

<div
class="status"
id="status">
Waiting...
</div>

<div
class="status"
id="lastRound">
</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const params =
new URLSearchParams(location.search);

let roomId = params.get("room");

let joined = false;
let chosen = false;

const createBtn =
document.getElementById("createRoom");

const joinSection =
document.getElementById("joinSection");

const game =
document.getElementById("game");

if(roomId){

document.getElementById("share")
.innerHTML =
"Share this room:<br>" +
location.href;

joinSection.classList.remove("hidden");

}else{

createBtn.onclick = () => {

const room =
Math.random()
.toString(36)
.slice(2,8);

location.href =
"?room=" + room;
};

}

document
.getElementById("joinBtn")
.onclick = () => {

const name =
document
.getElementById("nameInput")
.value
.trim();

if(!name) return;

socket.emit("join",{
roomId,
name
});

joined = true;

joinSection.classList.add("hidden");

game.classList.remove("hidden");
};

socket.on("roomFull",()=>{

alert("Room is full.");

});

socket.on("state",state=>{

const players = state.players;

document
.getElementById("roundCounter")
.innerHTML =
`Round ${
Math.min(
state.round,
state.maxRounds
)
} / ${state.maxRounds}`;

document
.getElementById("players")
.innerHTML =
players
.map(p=>p.name)
.join(" vs ");

document
.getElementById("scoreboard")
.innerHTML =
players
.map(p =>
`<div>
<b>${p.name}</b><br>
${p.score}
</div>`
)
.join("");

if(players.length === 1){

document
.getElementById("status")
.innerHTML =
"Waiting for another player...";

return;
}

if(state.gameOver){

document
.getElementById("status")
.innerHTML =
"Game Over";

document
.getElementById("coopBtn")
.disabled = true;

document
.getElementById("compBtn")
.disabled = true;

return;
}

if(chosen){

document
.getElementById("status")
.innerHTML =
state.choicesSubmitted === 1
?
"Waiting for opponent..."
:
"Round resolving...";
}
else{

document
.getElementById("status")
.innerHTML =
state.choicesSubmitted === 1
?
"Opponent has chosen. It is your turn."
:
"Choose your action.";
}

if(state.lastRound){

document
.getElementById("lastRound")
.innerHTML =
`
<h3>Previous Round</h3>

${state.lastRound.player1}
chose
<b>${state.lastRound.choice1}</b>

<br>

${state.lastRound.player2}
chose
<b>${state.lastRound.choice2}</b>

<br><br>

Round Score:

<br>

${state.lastRound.player1}
+${state.lastRound.score1}

<br>

${state.lastRound.player2}
+${state.lastRound.score2}
`;

chosen = false;

document
.getElementById("coopBtn")
.disabled = false;

document
.getElementById("compBtn")
.disabled = false;
}

});

function choose(choice){

if(chosen) return;

chosen = true;

document
.getElementById("coopBtn")
.disabled = true;

document
.getElementById("compBtn")
.disabled = true;

socket.emit("choice",{
roomId,
choice
});
}

document
.getElementById("coopBtn")
.onclick =
()=>choose("cooperate");

document
.getElementById("compBtn")
.onclick =
()=>choose("compete");

</script>

</body>
</html>
