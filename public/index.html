<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pact Machine</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#121212;
  color:#e5e5e5;

  display:flex;
  justify-content:center;

  padding:20px;
}

.card{
  width:100%;
  max-width:800px;

  background:#1e1e1e;

  border-radius:16px;

  padding:30px;
}

h1,h2,h3{
  text-align:center;
}

.center{
  text-align:center;
}

.hidden{
  display:none;
}

button{
  background:#333;
  color:white;

  border:1px solid #555;

  border-radius:10px;

  padding:14px 24px;

  cursor:pointer;

  font-size:16px;
}

button:hover{
  background:#444;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.big-btn{
  width:180px;
  margin:10px;
}

input{
  background:#2a2a2a;
  color:white;

  border:1px solid #555;

  border-radius:10px;

  padding:12px;

  width:250px;

  font-size:16px;
}

.scoreboard{
  display:flex;
  justify-content:center;
  gap:20px;

  margin:25px 0;

  flex-wrap:wrap;
}

.score-card{

  width:180px;

  background:#2a2a2a;

  border:1px solid #444;

  border-radius:12px;

  padding:20px;

  text-align:center;
}

.score-name{
  font-size:18px;
  margin-bottom:10px;
}

.score-value{
  font-size:42px;
  font-weight:bold;
}

.score-label{
  opacity:.7;
  font-size:14px;
}

.progress{
  text-align:center;
  font-size:18px;
  margin-bottom:20px;
}

.status{

  background:#2a2a2a;

  border-radius:10px;

  padding:15px;

  margin-top:20px;

  text-align:center;
}

.round-results{

  background:#2a2a2a;

  border-radius:10px;

  padding:15px;

  margin-top:20px;

  line-height:1.8;
}

</style>

</head>

<body>

<div class="card">

<h1>Pact Machine</h1>

<div id="lobby">

<div class="center">

<button id="createRoom">
Create Room
</button>

<p id="share"></p>

</div>

</div>

<div id="joinSection" class="hidden">

<h2>Enter Your Name</h2>

<div class="center">

<input
id="nameInput"
placeholder="Your name">

<br><br>

<button id="joinBtn">
Join Game
</button>

</div>

</div>

<div id="game" class="hidden">

<h2 id="players"></h2>

<div id="scoreboard"
class="scoreboard">
</div>

<div
id="roundCounter"
class="progress">
</div>

<div class="center">

<button
id="coopBtn"
class="big-btn">
Cooperate
</button>

<button
id="compBtn"
class="big-btn">
Compete
</button>

</div>

<div
id="status"
class="status">
Waiting...
</div>

<div
id="lastRound"
class="round-results">
</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const params =
new URLSearchParams(location.search);

const roomId =
params.get("room");

let chosen = false;

const createBtn =
document.getElementById("createRoom");

if(roomId){

document.getElementById("share")
.innerHTML =
"Share this room:<br><br>" +
location.href;

document
.getElementById("joinSection")
.classList.remove("hidden");

}else{

createBtn.onclick = ()=>{

const room =
Math.random()
.toString(36)
.slice(2,8);

location.href =
"?room=" + room;
};

}

document
.getElementById("joinBtn")
.onclick = ()=>{

const name =
document
.getElementById("nameInput")
.value
.trim();

if(!name) return;

socket.emit("join",{
roomId,
name
});

document
.getElementById("joinSection")
.classList.add("hidden");

document
.getElementById("game")
.classList.remove("hidden");
};

socket.on("roomFull",()=>{

alert("Room is already full.");

});

socket.on("state",state=>{

const players =
state.players;

document
.getElementById("players")
.innerHTML =
players
.map(p=>p.name)
.join(" vs ");

document
.getElementById("roundCounter")
.innerHTML =
`Round ${
Math.min(
state.round,
state.maxRounds
)
}
/
${state.maxRounds}`;

document
.getElementById("scoreboard")
.innerHTML =
players.map(p=>`

<div class="score-card">

<div class="score-name">
${p.name}
</div>

<div class="score-value">
${p.score}
</div>

<div class="score-label">
points
</div>

</div>

`).join("");

if(players.length === 1){

document
.getElementById("status")
.innerHTML =
"Waiting for another player...";

return;
}

if(state.gameOver){

document
.getElementById("status")
.innerHTML =
"<b>Game Over</b>";

document
.getElementById("coopBtn")
.disabled = true;

document
.getElementById("compBtn")
.disabled = true;

return;
}

if(chosen){

document
.getElementById("status")
.innerHTML =
state.choicesSubmitted === 1
?
"✓ Choice submitted. Waiting for opponent..."
:
"Resolving round...";
}
else{

document
.getElementById("status")
.innerHTML =
state.choicesSubmitted === 1
?
"Opponent has chosen. It is your turn."
:
"Choose your action.";
}

if(state.lastRound){

document
.getElementById("lastRound")
.innerHTML =

`<h3>Previous Round</h3>

${state.lastRound.player1}
chose
<b>${state.lastRound.choice1}</b>

<br>

${state.lastRound.player2}
chose
<b>${state.lastRound.choice2}</b>

<br><br>

<b>Round Score</b>

<br>

${state.lastRound.player1}
+${state.lastRound.score1}

<br>

${state.lastRound.player2}
+${state.lastRound.score2}
`;

chosen = false;

document
.getElementById("coopBtn")
.disabled = false;

document
.getElementById("compBtn")
.disabled = false;
}

});

function choose(choice){

if(chosen) return;

chosen = true;

document
.getElementById("coopBtn")
.disabled = true;

document
.getElementById("compBtn")
.disabled = true;

socket.emit("choice",{
roomId,
choice
});
}

document
.getElementById("coopBtn")
.onclick =
()=>choose("cooperate");

document
.getElementById("compBtn")
.onclick =
()=>choose("compete");

</script>

</body>
</html>
